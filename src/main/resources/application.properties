# Application Name
spring.application.name=Ostad_SpringBoot

# Custom Configuration Properties for Development Environment
app.message=Welcome to the Development Environment!
app.api.url=http://localhost:8080/dev/api

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY:cf4f7d38f8244e318a3161306261401}
weather.api.base-url=https://api.weatherapi.com/v1

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.example.Ostad_SpringBoot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n