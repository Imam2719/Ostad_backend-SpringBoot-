# Application Name
spring.application.name=Ostad_SpringBoot

# Server
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/ostad_springboot
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Email Configuration - JavaMailSender with Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sfms0674@gmail.com
spring.mail.password=cgiu udcu blaj sltq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Verification Configuration
verification.link.expiry.minutes=10
verification.link.rate.limit.minutes=5


app.base.url=http://localhost:8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads

github.token=${GITHUB_TOKEN:token-not-set}

# Target repository
github.repo.owner=abusaeed2433
github.repo.name=JavaInREADME

github.sync.cron=0 0 */12 * * *

# Logging
logging.level.root=INFO
logging.level.com.example.Ostad_SpringBoot=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n